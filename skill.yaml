name: telegram-client
version: 0.3.0
description: Professional Telegram User-Account client for OpenClaw agents.
author: Aleksandr
repository: https://github.com/Polterageist/openclaw-telegram-client-plugin
license: MIT
type: skill
tags:
  - telegram
  - chat
  - automation
  - context

config:
  - name: BACKEND
    type: string
    default: "telethon"
    description: "Backend to use (telethon or tg_cli)"
  - name: APP_ID
    type: string
    secret: true
    description: "Telegram API ID"
  - name: API_HASH
    type: string
    secret: true
    description: "Telegram API Hash"

tools:
  - name: tg.chats
    description: "List recent Telegram dialogs"
  - name: tg.history
    description: "Get message history from a specific chat"
  - name: tg.login
    description: "Initiate authentication process"
